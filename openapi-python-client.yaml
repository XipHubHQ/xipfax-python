# openapi-python-client 0.29.1's settings for the SDK, which scripts/generate.sh passes it with the
# document scripts/sdk-document.jq writes.
project_name_override: xipfax-sdk
package_name_override: xipfax_sdk
# Each set of values a request takes, a listFaxes direction or a listOffices place, is a Literal of
# its strings, so a call names its value as text: direction="sent".
literal_enums: true
# ruff formats what the generator writes, by pyproject.toml's settings: the generator's own two
# hooks for a package with no metadata, named here so that they can't change under it.
post_hooks:
  - ruff check . --fix-only --extend-select=I
  - ruff format .
# The API's refusal is APIError, as the Go SDK's is and the TypeScript SDK's ApiError: Error alone
# reads as Python's errors do. A nested model is named for the model it is in, so each name below is
# the generator's, built on the name before it.
class_overrides:
  Error:
    class_name: APIError
  APIErrorError:
    class_name: APIErrorObject
  APIErrorObjectDetailsItem:
    class_name: APIErrorDetail
  OfficeSourcesItem:
    class_name: OfficeSource
